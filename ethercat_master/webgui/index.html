<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EtherCAT Master</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>EtherCAT Master</h1>
  <div class="spacer"></div>
  <div id="busState" class="bus-state st-idle">
    <span class="dot"></span>
    <span id="stateBadge" class="label">IDLE</span>
    <span id="stateInfo" class="detail"></span>
  </div>
</header>

<main>
  <div id="errorBox" class="alert" hidden></div>

  <div class="col">
    <section class="panel">
      <div class="panel-head">
        <h2>Adapter</h2>
        <div class="spacer"></div>
        <button class="btn btn-link" type="button" onclick="refreshAdapters()">Refresh</button>
      </div>
      <ul id="adapterGrid" class="adapters"><li class="empty">Loading adapters&hellip;</li></ul>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Process data</h2></div>
      <div class="panel-body">
        <div class="field">
          <label for="cycleTime">Cycle time</label>
          <div class="input-unit"><input type="number" id="cycleTime" value="1000" min="50" max="100000" step="10"><span>&micro;s</span></div>
        </div>
      </div>
      <div class="panel-foot">
        <button class="btn btn-primary btn-block" id="btnGoOp" type="button" onclick="doGoOp()">Go to OP</button>
        <button class="btn btn-stop btn-block" id="btnStop" type="button" onclick="doStop()" hidden>Stop</button>
      </div>
    </section>
  </div>

  <div class="col">
    <section class="panel">
      <div class="panel-head">
        <h2>Slaves</h2>
        <span id="discoveryStatus" class="msg"></span>
        <div class="spacer"></div>
        <button class="btn btn-small" id="btnScan" type="button" onclick="scanBus()">Scan bus</button>
      </div>
      <div id="discoveryResult"><div class="empty">Select an adapter and scan the bus to list the connected slaves.</div></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>SDO latency</h2>
        <span class="hint">Round-trip time of SDO reads, bus must be in OP</span>
      </div>
      <div class="panel-body">
        <div class="field-row">
          <div class="field">
            <label for="netTestSlave">Slave</label>
            <div class="input-unit"><input type="number" id="netTestSlave" value="0" min="0" max="255" step="1" style="width:60px"></div>
          </div>
          <div class="field">
            <label for="netTestSamples">Samples</label>
            <div class="input-unit"><input type="number" id="netTestSamples" value="200" min="10" max="2000" step="10" style="width:80px"></div>
          </div>
          <button class="btn" id="btnNetTest" type="button" onclick="runNetworkTest()">Run</button>
          <span id="netTestStatus" class="msg" style="align-self:center"></span>
        </div>
        <div id="netTestResult" hidden></div>
      </div>
    </section>
  </div>
</main>

<footer>&copy; 2026 Henschel-Robotics GmbH</footer>

<script>
var host = window.location.origin + "/";
var _selectedAdapter = null;
var _discoveredSlaves = [];
var _busState = "IDLE";
var _pollTimer = null;

var STATE_CLASS = { "IDLE": "idle", "INIT": "busy", "PRE-OP": "preop", "SAFE-OP": "safeop", "OP": "op", "ERROR": "err" };

function byId(id) { return document.getElementById(id); }

function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function(c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
}

function getJson(url, opts) {
    return fetch(url, opts).then(function(r) { return r.json(); });
}

function setMsg(el, text, kind, extra) {
    if (!el) return;
    el.className = "msg" + (kind ? " " + kind : "");
    el.innerHTML = esc(text) + (extra || "");
}

// ---------- State display ----------

function showState(label, info) {
    byId("busState").className = "bus-state st-" + (STATE_CLASS[label] || "idle");
    byId("stateBadge").textContent = label;
    byId("stateInfo").textContent = info || "";
}

function setBusState(state, slaves, error) {
    _busState = state;
    var isOp = (state === "OP");
    var info = "";
    if (isOp) {
        info = (slaves ? slaves + (slaves === 1 ? " slave" : " slaves") + " \u00b7 " : "") +
               byId("cycleTime").value + " \u00b5s";
    }
    showState(state, info);

    var errBox = byId("errorBox");
    errBox.textContent = error || "";
    errBox.hidden = !error;

    byId("btnGoOp").hidden = isOp;
    byId("btnStop").hidden = !isOp;
    byId("btnScan").disabled = isOp;
    byId("cycleTime").disabled = isOp;
    byId("adapterGrid").classList.toggle("locked", isOp);
    byId("adapterGrid").querySelectorAll("input").forEach(function(r) { r.disabled = isOp; });

    if (isOp && !_pollTimer) {
        _pollTimer = setInterval(pollStatus, 3000);
    } else if (!isOp && _pollTimer) {
        clearInterval(_pollTimer);
        _pollTimer = null;
    }
}

function pollStatus() {
    getJson(host + "api/status").then(function(data) {
        if (data.state && data.state !== _busState) {
            setBusState(data.state, data.slaves, data.error);
        }
    }).catch(function() {});
}

// ---------- Adapters ----------

function selectAdapter(name) {
    _selectedAdapter = name;
    byId("adapterGrid").querySelectorAll(".adapter").forEach(function(li) {
        var on = li.dataset.name === name;
        li.classList.toggle("selected", on);
        li.querySelector("input").checked = on;
    });
}

function refreshAdapters() {
    getJson(host + "api/adapters").then(function(data) {
        var list = byId("adapterGrid");
        if (data.error) {
            list.innerHTML = "<li class='empty'>" + esc(data.error) + "</li>";
            return;
        }
        var adapters = data.adapters || [];
        if (!adapters.length) {
            list.innerHTML = "<li class='empty'>No wired Ethernet adapter found. Is Npcap / libpcap installed?</li>";
            return;
        }
        list.innerHTML = adapters.map(function(a, i) {
            return "<li class='adapter' data-name='" + esc(a.name) + "'>" +
                "<input type='radio' name='adapter' id='ad" + i + "'>" +
                "<label for='ad" + i + "' style='cursor:inherit'><div class='name'>" + esc(a.desc || a.name) + "</div>" +
                "<div class='path'>" + esc(a.name) + "</div></label></li>";
        }).join("");
        list.querySelectorAll(".adapter").forEach(function(li) {
            li.onclick = function() { if (_busState !== "OP") selectAdapter(li.dataset.name); };
        });
        var names = adapters.map(function(a) { return a.name; });
        var pick = names.indexOf(data.current) >= 0 ? data.current
                 : names.indexOf(_selectedAdapter) >= 0 ? _selectedAdapter : names[0];
        selectAdapter(pick);
        if (data.state) setBusState(data.state, null, null);
    }).catch(function() {});
}

// ---------- Go OP / Stop ----------

function doGoOp() {
    setBusState("IDLE", null, null);
    showState("INIT", "Connecting\u2026");
    byId("btnGoOp").disabled = true;

    var cycle = parseFloat(byId("cycleTime").value) / 1000;
    var params = "adapter=" + encodeURIComponent(_selectedAdapter || "") + "&cycle=" + cycle;
    getJson(host + "api/connect?" + params).then(function(data) {
        byId("btnGoOp").disabled = false;
        if (data.error) setBusState("IDLE", null, data.error);
        else setBusState(data.state || "OP", data.slaves, null);
    }).catch(function(e) {
        byId("btnGoOp").disabled = false;
        setBusState("IDLE", null, "Request failed: " + e);
    });
}

function doStop() {
    byId("btnStop").disabled = true;
    var done = function() {
        byId("btnStop").disabled = false;
        setBusState("IDLE", null, null);
    };
    getJson(host + "api/disconnect").then(done).catch(done);
}

// ---------- PDO configuration ----------

function pdoObjects(p) {
    if (!p.objects || !p.objects.length) return "";
    return p.objects.map(function(o) {
        if (typeof o === "string") return o;
        if (o && o.index !== undefined) return o.index + ":" + o.subindex + "/" + o.bits;
        return String(o);
    }).join("  ");
}

function pdoList(slaveIdx, dir, availList, assignedList) {
    if (!availList || !availList.length) return "<div class='note'>None</div>";
    var assigned = {};
    (assignedList || []).forEach(function(p) { assigned[p.pdo_index] = true; });
    return availList.map(function(p) {
        if (p.readonly || p.pdo_index === "SII") {
            return "<div class='pdo fixed'><span>" + esc(p.label || p.pdo_index) + "</span></div>";
        }
        var id = "pdoCb_" + slaveIdx + "_" + dir + "_" + p.pdo_index;
        return "<label class='pdo'><input type='checkbox' id='" + esc(id) + "'" + (assigned[p.pdo_index] ? " checked" : "") + ">" +
            "<span class='idx'>" + esc(p.pdo_index) + "</span>" +
            "<span class='objs'>" + esc(p.label || pdoObjects(p)) + "</span></label>";
    }).join("");
}

function savePdoConfig() {
    var payload = {
        network: { adapter: _selectedAdapter, cycle_ms: parseFloat(byId("cycleTime").value) / 1000 },
        slaves: {}
    };
    _discoveredSlaves.forEach(function(s) {
        var pick = function(list, dir) {
            var out = [];
            (list || []).forEach(function(p) {
                if (!/^0x[0-9A-Fa-f]+$/i.test(p.pdo_index)) return;
                var cb = byId("pdoCb_" + s.index + "_" + dir + "_" + p.pdo_index);
                if (cb && cb.checked) out.push(p.pdo_index);
            });
            return out;
        };
        payload.slaves[String(s.index)] = { rx_pdo: pick(s.available_rx_pdo, "rx"), tx_pdo: pick(s.available_tx_pdo, "tx") };
    });
    var statusEl = byId("pdoSaveStatus");
    setMsg(statusEl, "Saving\u2026");
    getJson(host + "api/pdo_config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
    .then(function(d) {
        if (d.error) { setMsg(statusEl, d.error, "bad"); return; }
        var pathInfo = d.path ? "<span class='path'>" + esc(d.path) + "</span>" : "";
        setMsg(statusEl, "Saved, reconnecting\u2026", "", pathInfo);
        saveAndReconnect(statusEl, pathInfo);
    }).catch(function(e) { setMsg(statusEl, String(e), "bad"); });
}

function saveAndReconnect(statusEl, pathInfo) {
    pathInfo = pathInfo || "";
    var params = _selectedAdapter != null ? "?adapter=" + encodeURIComponent(_selectedAdapter) : "";
    getJson(host + "api/disconnect")
    .then(function() {
        setBusState("IDLE", null, null);
        setMsg(statusEl, "Scanning bus\u2026", "", pathInfo);
        return getJson(host + "api/discover" + params);
    })
    .then(function(data) {
        if (data.error) { setMsg(statusEl, "Scan failed: " + data.error, "bad", pathInfo); return; }
        doGoOp();
        setMsg(statusEl, "Saved", "ok", pathInfo);
    })
    .catch(function(e) { setMsg(statusEl, "Reconnect failed: " + e, "bad", pathInfo); });
}

// ---------- Bus discovery ----------

function toggleSlave(row) {
    var detail = row.nextElementSibling;
    if (!detail || !detail.classList.contains("pdo-row")) return;
    detail.hidden = !detail.hidden;
    row.classList.toggle("open", !detail.hidden);
}

function renderSlaves(slaves) {
    var rows = slaves.map(function(s) {
        var hasPdo = (s.available_rx_pdo && s.available_rx_pdo.length) || (s.available_tx_pdo && s.available_tx_pdo.length);
        var title = s.device_name || s.name || ("Slave " + s.index);
        var sub = [];
        if (s.device_name && s.name && s.name !== s.device_name) sub.push(s.name);
        if (s.hw_version) sub.push("HW " + s.hw_version);
        if (s.fw_version) sub.push("FW " + s.fw_version);
        var st = String(s.state || "");
        var row = "<tr class='slave-row'" + (hasPdo ? " onclick='toggleSlave(this)'" : "") + ">" +
            "<td class='pos'>" + (hasPdo ? "<span class='caret'>\u25b8</span>" : "") + esc(s.index) + "</td>" +
            "<td><div class='dev'>" + esc(title) + "</div>" + (sub.length ? "<div class='sub'>" + esc(sub.join(" \u00b7 ")) + "</div>" : "") + "</td>" +
            "<td class='mono'>" + esc(s.vendor_id) + "</td>" +
            "<td class='mono'>" + esc(s.product_code) + "</td>" +
            "<td class='mono'>" + esc(s.revision) + "</td>" +
            "<td><span class='state-tag " + (STATE_CLASS[st.replace(/\s*\+.*$/, "")] || "") + "'>" + esc(st) + "</span></td>" +
            "<td class='r num'>" + esc(s.input_bytes) + "</td>" +
            "<td class='r num'>" + esc(s.output_bytes) + "</td></tr>";
        if (hasPdo) {
            row += "<tr class='pdo-row' hidden><td colspan='8'><div class='pdo-cols'>" +
                "<div><h3>RxPDO, master to slave</h3>" + pdoList(s.index, "rx", s.available_rx_pdo, s.rx_pdo) + "</div>" +
                "<div><h3>TxPDO, slave to master</h3>" + pdoList(s.index, "tx", s.available_tx_pdo, s.tx_pdo) + "</div>" +
                "</div>" + (s.sii_only ? "<div class='note'>Fixed PDO mapping from the SII/EEPROM, the device has no CoE. Read-only.</div>" : "") +
                "</td></tr>";
        }
        return row;
    }).join("");
    return "<table><thead><tr><th>#</th><th>Device</th><th>Vendor</th><th>Product</th><th>Revision</th><th>State</th>" +
        "<th class='r'>In [B]</th><th class='r'>Out [B]</th></tr></thead><tbody>" + rows + "</tbody></table>" +
        "<div class='panel-foot'><button class='btn btn-small' type='button' onclick='savePdoConfig()'>Save PDO mapping</button>" +
        "<span id='pdoSaveStatus' class='msg'>Click a slave to edit its PDO assignment.</span></div>";
}

function scanBus() {
    if (_busState === "OP") return;
    var statusEl = byId("discoveryStatus");
    var resultEl = byId("discoveryResult");
    byId("btnScan").disabled = true;
    setMsg(statusEl, "Scanning\u2026");
    _discoveredSlaves = [];
    var params = _selectedAdapter != null ? "?adapter=" + encodeURIComponent(_selectedAdapter) : "";
    getJson(host + "api/discover" + params).then(function(data) {
        byId("btnScan").disabled = (_busState === "OP");
        if (data.error) { setMsg(statusEl, data.error, "bad"); return; }
        var slaves = data.slaves || [];
        if (!slaves.length) {
            setMsg(statusEl, "");
            resultEl.innerHTML = "<div class='empty'>No slaves found on this adapter.</div>";
            return;
        }
        _discoveredSlaves = slaves;
        setMsg(statusEl, slaves.length + (slaves.length === 1 ? " slave" : " slaves"));
        resultEl.innerHTML = renderSlaves(slaves);
    }).catch(function(e) {
        byId("btnScan").disabled = false;
        setMsg(statusEl, String(e), "bad");
    });
}

// ---------- SDO latency ----------

function runNetworkTest() {
    var statusEl = byId("netTestStatus");
    if (_busState !== "OP") { setMsg(statusEl, "Go to OP first.", "bad"); return; }
    var slave = byId("netTestSlave").value;
    var samples = byId("netTestSamples").value;
    var btn = byId("btnNetTest");
    btn.disabled = true;
    setMsg(statusEl, "Reading " + samples + " SDOs\u2026");
    byId("netTestResult").hidden = true;

    getJson(host + "api/run_network_test?slave=" + encodeURIComponent(slave) + "&samples=" + encodeURIComponent(samples))
    .then(function(data) {
        btn.disabled = false;
        if (data.error) { setMsg(statusEl, data.error, "bad"); return; }
        setMsg(statusEl, "");
        showNetTestResult(data);
    }).catch(function(e) {
        btn.disabled = false;
        setMsg(statusEl, String(e), "bad");
    });
}

function showNetTestResult(data) {
    var el = byId("netTestResult");
    var cell = function(label, value, unit) {
        return "<div><dt>" + label + "</dt><dd>" + esc(value) + (unit ? " <small>" + unit + "</small>" : "") + "</dd></div>";
    };
    el.innerHTML = "<dl class='stats'>" +
        cell("Samples", data.count, data.errors ? data.errors + " failed" : "") +
        cell("Min", data.min_ms, "ms") + cell("Median", data.median_ms, "ms") + cell("Mean", data.mean_ms, "ms") +
        cell("P95", data.p95_ms, "ms") + cell("P99", data.p99_ms, "ms") + cell("Max", data.max_ms, "ms") +
        "</dl>" + renderHistogram(data.samples, data.median_ms, data.p99_ms) +
        "<div class='note'>Std. deviation " + esc(data.std_ms) + " ms. Dashed lines: median (black), P99 (red).</div>";
    el.hidden = false;
}

function renderHistogram(samples, median, p99) {
    if (!samples || !samples.length) return "";
    var min = Math.min.apply(null, samples), max = Math.max.apply(null, samples);
    var bins = 40, range = Math.max(max - min, 0.001), bw = range / bins;
    var counts = [];
    for (var b = 0; b < bins; b++) counts[b] = 0;
    samples.forEach(function(v) { counts[Math.min(bins - 1, Math.floor((v - min) / bw))]++; });
    var top = Math.max.apply(null, counts);

    var W = 1000, H = 150, padB = 20, plotH = H - padB - 4, colW = W / bins;
    var x = function(v) { return (v - min) / range * W; };
    var svg = "<svg class='hist' viewBox='0 0 " + W + " " + H + "' preserveAspectRatio='none'>";
    counts.forEach(function(c, i) {
        if (!c) return;
        var h = Math.max(1, c / top * plotH);
        svg += "<rect class='bar' x='" + (i * colW + 1) + "' y='" + (plotH - h + 4) + "' width='" + (colW - 2) + "' height='" + h + "'>" +
            "<title>" + (min + i * bw).toFixed(3) + "\u2013" + (min + (i + 1) * bw).toFixed(3) + " ms: " + c + "</title></rect>";
    });
    [["med", median], ["p99", p99]].forEach(function(m) {
        if (m[1] == null) return;
        var xm = x(m[1]);
        svg += "<line class='mark " + m[0] + "' x1='" + xm + "' x2='" + xm + "' y1='4' y2='" + (plotH + 4) + "'/>";
    });
    svg += "<line class='axis' x1='0' x2='" + W + "' y1='" + (plotH + 4) + "' y2='" + (plotH + 4) + "'/></svg>";
    return svg + "<div style='display:flex;justify-content:space-between' class='mono muted'><span>" +
        min.toFixed(3) + " ms</span><span>" + max.toFixed(3) + " ms</span></div>";
}

// ---------- Init ----------

refreshAdapters();
getJson(host + "api/connection").then(function(data) {
    if (data.cycle != null) byId("cycleTime").value = Math.round(data.cycle * 1000);
    setBusState(data.state || "IDLE", data.slaves, data.error);
}).catch(function() {});
</script>
</body>
</html>
