[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "ethercat-master"
version = "0.2.0"
description = "Generic EtherCAT master library built directly on SOEM 2.x — bus management, PDO mapping, slave discovery"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.8"
authors = [
    {name = "Henschel Robotics GmbH", email = "info@henschel-robotics.ch"},
]
maintainers = [
    {name = "Henschel Robotics GmbH", email = "info@henschel-robotics.ch"},
]
keywords = ["ethercat", "soem", "fieldbus", "motion-control", "industrial", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = []

[project.scripts]
ecmaster-web = "ethercat_master.webserver:main"

[project.urls]
Homepage = "https://henschel-robotics.ch"
Documentation = "https://henschel-robotics.ch"
Repository = "https://github.com/henschel-robotics/python-ethercat-master"
Issues = "https://github.com/henschel-robotics/python-ethercat-master/issues"

[project.optional-dependencies]
pysoem = ["pysoem>=1.1.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "build>=1.0",
    "twine>=5.0",
]

[tool.scikit-build]
wheel.py-api = "py3"
wheel.packages = ["ethercat_master"]
cmake.build-type = "Release"
cmake.version = ">=3.16"
sdist.include = ["third_party/SOEM/**"]

[tool.ruff]
target-version = "py38"
line-length = 100
